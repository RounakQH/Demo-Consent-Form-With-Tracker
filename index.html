<!DOCTYPE html>
<html lang="english">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lorem Ipsum Technologies - Consent Form</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500&display=swap" rel="stylesheet">

<body>
<div class="consent">
  <div class="card">
    <div class="logo-language-wrapper">
      <div class="language-selector">
        <select id="languageDropdown" class="styled-select">
        <option value="english">English</option><option value="hindi">Hindi</option><option value="marathi">Marathi</option>
        </select>
      </div>

      <div class="logo-container left">
        <img src="https://demo-shp.qhtpl.com/cpm-api/upload/v1/fileDownloads?fileUrl=hdfs://sdp-hdfs-namenode.hdfs.svc.cluster.local:9820/jars/1749708737749_cropped_image.png" class="logo">
        <span class="company-name" data-translate="companyName">Lorem Ipsum Technologies</span>
      </div>
    </div>

    <!-- Permissions -->
    <div id="permissions">
      
          <div class="permission-block">
            <p data-translate-text="684a70d3be761974ae478e9d" style="display: flex; margin-top: 10px;">Would you like to receive email updates from us?<span class="mandatory">*</span></p>
            
            <label class="radio-label">
              <input class="radio-text font-14" type="radio" name="684a70d3be761974ae478e9d" value="Yes, send me all updates, promotional emails and newsletters" data-translate-option="684a70d3be761974ae478e9d"><span class="radio-tex">Yes, send me all updates, promotional emails and newsletters</span>
            </label>
          
            <label class="radio-label">
              <input type="radio" name="684a70d3be761974ae478e9d" value="Only send me important updates (e.g., account notices)" data-translate-option="684a70d3be761974ae478e9d"> Only send me important updates (e.g., account notices)
            </label>
          
            <label class="radio-label">
              <input type="radio" name="684a70d3be761974ae478e9d" value="No, I do not want to receive any emails" data-translate-option="684a70d3be761974ae478e9d"> No, I do not want to receive any emails
            </label>
          
          </div>
        
          <div class="permission-block">
            <p data-translate-text="684a70d3be761974ae478e9e" class="d-flex mt-1">Do you agree to receive personalised ads based on your data? <span class="mandatory">*</span></p>
            
            <label class="radio-label">
              <input type="radio" name="684a70d3be761974ae478e9e" value="Yes, personalize my ads and content" data-translate-option="684a70d3be761974ae478e9e"> Yes, personalize my ads and content
            </label>
          
            <label class="radio-label">
              <input type="radio" name="684a70d3be761974ae478e9e" value="Only use limited data for non personalized ads" data-translate-option="684a70d3be761974ae478e9e"> Only use limited data for non personalized ads
            </label>
          
            <label class="radio-label">
              <input type="radio" name="684a70d3be761974ae478e9e" value="No, do not use my data for advertising" data-translate-option="684a70d3be761974ae478e9e"> No, do not use my data for advertising
            </label>
          
          </div>
        
          <div class="permission-block">
            <p data-translate-text="684a70d3be761974ae478e9f" class="d-flex mt-1">What level of data collection are you comfortable with? <span class="mandatory">*</span></p>
            
            <label class="radio-label">
              <input type="radio" name="684a70d3be761974ae478e9f" value="Full consent – collect and store all relevant data" data-translate-option="684a70d3be761974ae478e9f"> Full consent – collect and store all relevant data
            </label>
          
            <label class="radio-label">
              <input type="radio" name="684a70d3be761974ae478e9f" value="Limited consent – only store what's needed for requested service" data-translate-option="684a70d3be761974ae478e9f"> Limited consent – only store what's needed for requested service
            </label>
          
            <label class="radio-label">
              <input type="radio" name="684a70d3be761974ae478e9f" value="No consent – do not store my data beyond this session" data-translate-option="684a70d3be761974ae478e9f"> No consent – do not store my data beyond this session
            </label>
          
          </div>
        
          <div class="permission-block">
            <p data-translate-text="684a70d3be761974ae478ea0" class="d-flex mt-1"><span>Can we share your data with our trusted partners?</span><span class="mandatory">*</span></p>
            
            <label class="radio-label">
              <input class="form-check-input" type="radio" name="684a70d3be761974ae478ea0"  data-translate-option="684a70d3be761974ae478ea0"> Yes, share with third parties for offers and promotions
            </label>
          
            <label class="radio-label">
              <input type="radio" name="684a70d3be761974ae478ea0" value="Only share with partners necessary for providing required service" data-translate-option="684a70d3be761974ae478ea0"> Only share with partners necessary for providing required service
            </label>
          
            <label class="radio-label">
              <input type="radio" name="684a70d3be761974ae478ea0" value="Do not share my data with any third parties" data-translate-option="684a70d3be761974ae478ea0"> Do not share my data with any third parties
            </label>
          
          </div>
        
    </div>

    <div id="error-message" class="error-message"></div>

     <div id="toast" style="
      visibility: hidden;
      min-width: 175px;
      margin-left: -125px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 4px;
      padding: 16px;
      position: fixed;
      z-index: 1000;
      right:10px;
      top:10px;
      font-size: 12px;
    "></div>


    <!-- Buttons -->
    <div class="button-group">
<ul class="list-inline wizard mb-0">
  <button type="button" class="cancel-btn" data-translate="cancelBtn"
  >
  Cancel
</button>
 
<button type="submit" class="btn-primary" id="submitButton" data-translate="submitBtn"
  >
  Submit
</button>
</ul>
</div>

  </div>
</div>
